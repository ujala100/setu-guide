name: security

# Secret scanning for every PR and every push to dev/main.
# Separate from the test workflow so it can be added without touching
# the CI files owned by DevOps 2.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan git history for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
