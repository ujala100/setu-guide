# Secret scanning before every commit.
#
# Setup (once per clone):
#   1. Install gitleaks v8.30.1 from https://github.com/gitleaks/gitleaks/releases
#      and make sure it is on PATH.
#   2. pip install pre-commit
#   3. pre-commit install
#
# After that, every `git commit` scans the staged changes and blocks real
# secrets before they reach the repository.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
