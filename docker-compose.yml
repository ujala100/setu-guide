# Local run for the Day 2 service. Owner: DevOps 1.
#
#   cp .env.example .env      # then edit values
#   docker compose up --build
#   curl localhost:8000/health
#
# Every setting is read from the environment (.env), never from this file, so
# placeholder values can change later without touching code.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: setu-guide-api:day2
    container_name: setu-guide-api
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped

    # Day 4 recovery hardening (docs/recovery_test_notes.md): give the container
    # more time than uvicorn's --timeout-graceful-shutdown (30s) before Docker
    # sends SIGKILL, so an in-flight request can finish on `docker stop` /
    # rolling restart instead of being cut off.
    stop_grace_period: 35s

    # Day 3 hardening: the API is fully in-memory, so the root filesystem can
    # be read-only. Only /tmp is writable, all capabilities are dropped and
    # privilege escalation is disabled.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Values come from .env (ignored by git). `required: false` keeps the file
    # optional so a fresh clone can still start with the built-in defaults.
    # AUTH_METHOD / API_KEY live there too: the default is "none" (the endpoint
    # is open), and switching it on needs a real API_KEY in .env - the
    # placeholder value from .env.example is refused at startup on purpose.
    env_file:
      - path: .env
        required: false

    # Optional: overrides for a single run, e.g.
    #   USE_MOCK=false docker compose up
    # environment:
    #   LOG_LEVEL: DEBUG

    # Model / knowledge-base files are mounted, not baked into the image.
    # Create the folder first if you use it (it is git-ignored):
    #   mkdir -p models && cp -r <your files> models/
    volumes:
      - ./models:/app/models:ro

    # /health is probed by the HEALTHCHECK defined in docker/Dockerfile.
